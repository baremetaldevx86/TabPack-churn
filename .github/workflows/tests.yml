name: CPU tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / Python 3.12 / CPU
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONHASHSEED: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            pyproject.toml
            .github/workflows/tests.yml

      - name: Install CPU PyTorch
        run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install common dependencies
        run: python -m pip install -r requirements/base.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Confirm CPU-only PyTorch
        run: python -c "import torch; assert torch.version.cuda is None; assert not torch.cuda.is_available()"

      # Tests use local synthetic fixtures and mocked transport; no data fetch step.
      - name: Run CPU tests
        run: python -m pytest -m 'not gpu'

      - name: Check source and test lint
        run: python -m ruff check tabpack tests
